name: Build article and store pages
# Runs after you merge a news pull request (or edit blog/posts.json), so each
# post's page always matches its latest text, including your "take" lines.
on:
  push:
    branches: [main]
    paths: ['blog/posts.json', 'assets/data/products.json']
  workflow_dispatch:
permissions:
  contents: write
  pages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/build-posts.mjs
      - run: node scripts/build-trends.mjs
      - run: node scripts/build-store.mjs
      - name: Commit changed pages
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add assets/data/trends.json blog/p blog/cover blog/feed.xml sitemap.xml store/index.html
          if ! git diff --cached --quiet; then
            git commit -m "Update article pages" && git push
            curl -s -X POST -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/pages/builds" || true
          fi
