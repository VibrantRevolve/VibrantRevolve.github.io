name: Daily tech news and grants
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/fetch-news.mjs

      # Fully automatic mode: set a repository VARIABLE named AUTO_PUBLISH to true
      # (Settings > Secrets and variables > Actions > Variables).
      - name: Publish straight to the site
        if: ${{ vars.AUTO_PUBLISH == 'true' }}
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add blog/posts.json
          git diff --cached --quiet || (git commit -m "Add daily news and grants" && git push)

      # Default mode: open a pull request so you can review before publishing.
      - name: Open a pull request for review
        if: ${{ vars.AUTO_PUBLISH != 'true' }}
        uses: peter-evans/create-pull-request@v7
        with:
          branch: news/drafts
          add-paths: blog/posts.json
          commit-message: Add news and grants drafts
          title: News and grants to review
          body: |
            New items from your feeds. Edit blog/posts.json to add your own
            "take" line or delete weak posts, then merge to publish.
